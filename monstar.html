
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monstars Playground</title>

    <link rel="stylesheet" href="monstar.css" />
    <script src="monstar.js" defer></script>
  </head>

  <body>

    <!-- Initial welcome popup -->
    <div class="welcome-overlay" id="welcomeOverlay">
      <section
        class="welcome-popup"
        role="dialog"
        aria-modal="true"
        aria-labelledby="welcomeTitle"
        aria-describedby="welcomeInstructions"
      >
        <h1 id="welcomeTitle" class="welcome-title">
          <span>M</span><span>O</span><span>N</span><span>S</span><span>T</span><span>A</span><span>R</span><span>S</span>
        </h1>

        <div class="welcome-instructions" id="welcomeInstructions">
          <p>MEET YOUR NEW MUSICAL FRIENDS!</p>

          <p>DRAG A MONSTER ONTO THE YELLOW STAGE TO HEAR THEM PLAY.</p>

          <p>MOVE THEM UP OR DOWN TO CHANGE HOW LOUD THEY SOUND!</p>

          <p>READY TO MAKE YOUR OWN MONSTER BAND?</p>
        </div>

        <button class="play-button" id="playButton" type="button">
          PLAY
        </button>
      </section>
    </div>

    <main>
      <section class="monster-stage">

        <!-- Three-step performance stage -->
        <img
          class="performance-stairs"
          src="Stairs 2.svg"
          alt=""
          draggable="false"
        />

        <!-- Bunny sound -->
        <img
          class="monster bunny"
          src="Bunny.svg"
          alt="Bunny singer"
          draggable="false"
          data-sound="assets/audio/bibi.mp3"
        />

        <!-- Drummer sound -->
        <img
          class="monster drummer"
          src="Drummer.svg"
          alt="Drummer"
          draggable="false"
          data-sound="assets/audio/surge.mp3"
        />

        <!-- Duckler sound -->
        <img
          class="monster duckler"
          src="Duckler.svg"
          alt="Duckler"
          draggable="false"
          data-sound="assets/audio/mr.p.mp3"
        />

        <!-- Guitar Monster sound -->
        <img
          class="monster guitar"
          src="Guitar.svg"
          alt="Guitar"
          draggable="false"
          data-sound="assets/audio/sirus.mp3"
        />

        <!-- Monking sound -->
        <img
          class="monster monking"
          src="Monking.svg"
          alt="Monking"
          draggable="false"
          data-sound="assets/audio/mico.mp3"
        />

      </section>
    </main>
  </body>
</html>
