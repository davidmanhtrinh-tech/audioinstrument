
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monstars Playground</title>

    <link rel="stylesheet" href="monstar.css" />
    <script src="monstar.js" defer></script>
  </head>

  <body>

    <main>
      <section class="monster-stage">

        <!-- Three-step performance stage -->
        <img
          class="performance-stairs"
          src="Stairs.svg"
          alt=""
          draggable="false"
        />

        <!-- Bunny sound -->
        <img
          class="monster bunny"
          src="Bunny.svg"
          alt="Bunny singer"
          draggable="false"
          data-sound="assets/audio/bibi.mp3"
        />

        <!-- Drummer sound -->
        <img
          class="monster drummer"
          src="Drummer.svg"
          alt="Drummer"
          draggable="false"
          data-sound="assets/audio/surge.mp3"
        />

        <!-- Duckler sound -->
        <img
          class="monster duckler"
          src="Duckler.svg"
          alt="Duckler"
          draggable="false"
          data-sound="assets/audio/mr.p.mp3"
        />

        <!-- Guitar Monster sound -->
        <img
          class="monster guitar"
          src="Guitar Monster.svg"
          alt="Guitar Monster"
          draggable="false"
          data-sound="assets/audio/sirus.mp3"
        />

        <!-- Monking sound -->
        <img
          class="monster monking"
          src="Monking.svg"
          alt="Monking"
          draggable="false"
          data-sound="assets/audio/mico.mp3"
        />

      </section>
    </main>
  </body>
</html>
