<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monstars Playground</title>

    <link rel="stylesheet" href="monstar.css" />
    <script src="monstar.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Monstars</h1>
    </header>

    <main>
      <section class="monster-stage">
        <img
          class="monster bunny"
          src="Bunny.png"
          alt="Bunny"
          draggable="false"
        />

        <img
          class="monster drummer"
          src="Drummer.png"
          alt="Drummer"
          draggable="false"
        />

        <img
          class="monster duckler"
          src="Duckler.png"
          alt="Duckler"
          draggable="false"
        />

        <img
          class="monster guitar"
          src="Guitar Monster.png"
          alt="Guitar Monster"
          draggable="false"
        />

        <img
          class="monster monking"
          src="Monking.png"
          alt="Monking"
          draggable="false"
        />
      </section>
    </main>
  </body>
</html>
