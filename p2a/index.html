<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
  </head>

  <body>
    <dialog id="intro-dialogue">
      <p>Hey I'm making some sound</p>
      <button id="intro-dialog-close">Okay bro</button>
    </dialog>

    <h1 id="main-heading">Hey guys, this is my audio instrument!!</h1>
    <button id="test-button">sound check</button>

    <header>
      <h1>Audio Instrument</h1>
    </header>

    <img id="onn-monster" src="Onn.svg" alt="Monster" />

    <main>
      <button id="test-button-2" data-note="c4">Test me</button>
      <button id="key-test" data-note="d4">key</button>

      <audio
        id="audio-track"
        src="./assets/audio/p-hase_Leapt.mp3"
        loop
        controls
      ></audio>

      <button id="random-time">random</button>
      <button id="play-button">play track</button>

      <input type="range" name="osc-range" id="osc-range" />
      <label for="osc-range">change osc</label>
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Augusta_Dohlmann_Wild_flowers_%281905%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
        alt="painting of flowers in a vase"
        id="flower-painting"
        data-note="a3"
      />
    </main>
  </body>
</html>
